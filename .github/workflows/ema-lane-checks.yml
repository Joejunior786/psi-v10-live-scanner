name: EMA independent lane checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade/v15-17-independent-ema, repair/v15-17-ema-report-heartbeat]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q psi_v15_17_ema_lane.py psi_v12_3_runner.py
      - run: python -m unittest -v test_v15_17_ema_lane.py test_v12_execution_gate.py test_v13_3_execution.py
