name: Binance Spot live depth scan (no Railway)
on:
  push:
    branches: [binance-liquidity-experiment-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Scan real Binance Spot USDT depth
        run: python3 tools/binance_spot_gap_scan.py
      - name: Save JSON result on isolated branch
        if: always()
        run: |
          if [ ! -f binance_spot_gap_results.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binance_spot_gap_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Binance Spot scan snapshot [skip ci]"
          git push
      - name: Upload timestamped scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-spot-depth-result
          path: binance_spot_gap_results.json
          if-no-files-found: warn
