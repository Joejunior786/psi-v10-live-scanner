name: Binance Spot early breakout scan
on:
  push:
    branches: [binance-liquidity-experiment-2026]
    paths:
      - 'tools/binance_spot_early_breakout_scan.py'
      - '.github/workflows/binance-spot-early-breakout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Scan Binance Spot early breakouts
        run: python3 tools/binance_spot_early_breakout_scan.py
      - name: Save timestamped results
        if: always()
        run: |
          if [ ! -f binance_spot_early_breakout_results.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binance_spot_early_breakout_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update early breakout Spot scan [skip ci]"
          git pull --rebase origin binance-liquidity-experiment-2026
          git push origin HEAD:binance-liquidity-experiment-2026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-spot-early-breakout
          path: binance_spot_early_breakout_results.json
          if-no-files-found: warn
